services:
  - type: web
    name: accessscan
    runtime: node
    plan: free
    # PLAYWRIGHT_BROWSERS_PATH=0 → browsers install into node_modules so they
    # persist from build to runtime (Render does not keep ~/.cache).
    buildCommand: PLAYWRIGHT_BROWSERS_PATH=0 npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

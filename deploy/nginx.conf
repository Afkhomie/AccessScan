# AccessScan — nginx server block (HTTPS termination)
# Copy into /etc/nginx/conf.d/accessscan.conf (Fedora nginx) or sites-enabled.
# Needs a cert first, e.g. certbot --nginx -d accessscan.example.com
# Rate limiting is IN-APP (server.js RATE_LIMIT_* env vars).

server {
    listen 443 ssl;
    server_name accessscan.example.com;

    # certbot-managed paths on Fedora:
    ssl_certificate     /etc/letsencrypt/live/accessscan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accessscan.example.com/privkey.pem;

    # AccessScan is a single-page app + JSON API on one port.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scans can take a while (Playwright crawl); don't time out early.
        proxy_read_timeout 300s;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name accessscan.example.com;
    return 301 https://$host$request_uri;
}
